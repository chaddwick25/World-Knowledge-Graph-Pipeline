[tool.poetry]
name = "EDA-Vector-Search-Toolkit"
version = "0.1.0"
description = "Vector Search Toolkit for Data Exploration"
authors = ["Chadwick <chaddwick25@yahoo.ca>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.8.1,<3.9"
numpy = "1.18.5"
osmium = "3.0.1"
setproctitle = "1.1.10"
tqdm = "4.48.2"
pandas = "1.1.1"
nodevectors = "0.1.22"
haversine = "2.3.0"
joblib = "0.16.0"
fasttext-wheel = "0.9.2"
numba = "0.51.2"
csrgraph = "0.1.22"
scipy = "^1.8.0"
scikit-learn = "^1.0"
psycopg2-binary = "^2.9.0"
psutil = "^7.0.0"
django = "^4.1"
djangorestframework = "^3.14.0"
django-cors-headers = "^3.13.0"
dj-database-url = "^2.1.0"
python-dotenv = "^1.0.0"
pgvector = "^0.2.0"
channels = "^4.0.0"
channels-redis = "^4.0.0"
celery = "^5.3.0"
redis = "^5.0.0"
requests = "^2.28.1"
beautifulsoup4 = "^4.12.3"
openpyxl = "^3.0.0"
matplotlib = "^3.3.0"
xlrd = "^2.0.1"
rdflib = "^7.0.0"
orjson = "^3.9.10"
geopandas = "^0.10.2"
networkx = "^3.0"
pyyaml = "^6.0.3"
django-prometheus = "2.3.1"
prometheus-client = "0.17.1"
statsmodels = "^0.14.0"
pyarrow = "11.0.0"
geohash2 = "^1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.4"
pytest-django = "^4.5.2"
django-extensions = "^3.2.3"
pygraphviz = "^1.11"
requests = "2.31.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
