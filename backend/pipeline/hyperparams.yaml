# Model hyperparameters for the WorldKG pipeline.
# Loaded once at startup into a frozen ModelHyperparams dataclass
# (pipeline/hyperparams.py). Allows tuning without redeploying.
#
# These values are runtime truth. The dataclass field defaults carry the
# paper-documented values as the code-level fallback when a key is absent.
# settings.py declares none of these knobs (folded out 2026-09-26).

uslp:
  # Unsupervised Spatial Link Prediction (USLP paper, arXiv:2304.09503).
  threshold: 0.7        # acceptance threshold for normalized_score
  top_k: 50             # top-k candidates per relation
  limit: 1720000        # max candidates to load (tuned via calibrate_uslp_thresholds; paper default 200000)
  max_heads: 4385000    # max head entities to process (tuned via calibrate_uslp_thresholds; paper default 50000)
  use_gpu: true         # GPU acceleration (was env USLP_USE_GPU; request override accepts 'auto' | 'true' | 'false')
  gpu_device: "cuda:0"  # worker container sees only GPU 1 (NVIDIA_VISIBLE_DEVICES=1)
  use_fp64: false       # fp32 by default (was settings USLP_USE_FP64)

deepwalk:
  # DeepWalk (Perozzi et al., KDD 2014) — the GV-NLE encoding model per the
  # GeoVectors paper (Tempelmeier et al., ISWC 2021).
  k: 50
  embedding_dim: 100
  walk_length: 80
  num_walks: 10
  workers: 26
  use_gpu: true
  gpu_device: "cuda:0"
  buffer_deg: 0.45

entropy:
  # Pre-flight entropy gating (was MIN_PREFLIGHT_SHANNON_ENTROPY /
  # MIN_PREFLIGHT_ENTROPY_DELTA).
  min_entropy: 1.5
  min_entropy_delta: 0.2

# GPU scheduling — shared by Step 4 (USLP) and Step 5 (GV-NLE).
# The worker container sees only GPU 1 (NVIDIA_VISIBLE_DEVICES=1), so the
# single cuda:0 device below matches the docker deployment.  Dual-GPU
# machines: "cuda:0,cuda:1" with gpu_concurrency "1,1".
gv_nle:
  gpu_devices: "cuda:0"
  gpu_concurrency: "1"
  small_pbf_mb: 0.3

# Step 1 parallel embedding upsert (embedding_service.py).
# Transcribed from the former .env PARALLEL_UPSERT_* values.
parallel_upsert:
  workers: 1
  queue_depth: 4
  min_pbf_mb: 200
  chunk_size: 20000

# Region enrichment worker threads (worldkg_enrichment_service.py).
enrichment:
  workers: 2

# preprocess_embeddings parallel split workers (was EMBEDDING_SPLITS_WORKERS).
embedding_splits:
  workers: 4

fasttext:
  model_path: null  # overridden by settings.FASTTEXT_MODEL_PATH
