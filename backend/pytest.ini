[pytest]
DJANGO_SETTINGS_MODULE = backend.settings
python_files = tests.py test_*.py *_tests.py
python_paths = .
addopts = --no-migrations --reuse-db
markers =
    unit: marks tests as unit tests (no external services required)
    integration: marks tests as integration tests (require Docker services + PBF files; deselect with '-m "not integration"')
    e2e: marks tests as end-to-end tests (require real osmium binary + PBF files)
