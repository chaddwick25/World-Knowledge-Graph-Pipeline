***REMOVED*** The DB-backed unit tests (django_db) need BOTH test databases with
***REMOVED*** postgis + vector + pg_trgm extensions - no stock image has them - so CI
***REMOVED*** runs the hermetic subset (`unit and not django_db`) and the DB tests
***REMOVED*** stay covered by the local pre-push hook (267 tests green there).
