# CI: unit tests on MR + dev pushes; images built from v* tags; Release
# object on v* tags.
#
# The DB-backed unit tests (django_db) need BOTH test databases with
# postgis + vector + pg_trgm extensions - no stock image has them - so CI
# runs the hermetic subset (`unit and not django_db`) and the DB tests
# stay covered by the local pre-push hook (267 tests green there).
# See plans/BETA_ROADMAP_PLAN.md §4 CI design notes.

stages:
  - test
  - build
  - release

backend-unit:
  stage: test
  image: python:3.8
  cache:
    key: pip-$CI_JOB_IMAGE
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  script:
    - pip install -r backend/requirements.txt
    - cd backend && python -m pytest -m "unit and not django_db" -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"

frontend-build:
  stage: test
  image: node:20
  cache:
    key: npm-$CI_JOB_IMAGE
    paths:
      - frontend-v3/.npm
  script:
    - cd frontend-v3 && npm ci --cache .npm && npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"

build-images:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  script:
    - export IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --build-arg VERSION="$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG" backend/
    - docker build --build-arg VITE_API_BASE_URL=/api --build-arg VITE_CARTO_API_KEY="$VITE_CARTO_API_KEY" -t "$CI_REGISTRY_IMAGE/edge:$IMAGE_TAG" -f frontend-v3/edge.Dockerfile frontend-v3/
    - docker push "$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/edge:$IMAGE_TAG"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    # Script-based (not the release: keyword): the keyword's config
    # validation fails on branch pipelines where $CI_COMMIT_TAG is empty
    # ("tag name should be a string", 2026-10-20).
    - release-cli create
        --name "Release $CI_COMMIT_TAG"
        --tag-name "$CI_COMMIT_TAG"
        --description "$CI_COMMIT_TAG_MESSAGE"
